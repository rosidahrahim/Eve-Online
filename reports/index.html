<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blunt Rotation Reports</title>
<style>
:root{--bg:#eef1f4;--ink:#14222e;--muted:#55677a;--line:#d2dae2;--accent:#0a6f8c;--duck:#973231;--panel:rgba(255,255,255,.84);--bad-soft:#fbe3e1;--stripe:rgba(10,111,140,.05);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0e1a24;--ink:#e5edf3;--muted:#93a7b8;--line:#27394a;--accent:#55c4e2;--duck:#c75757;--panel:rgba(20,36,47,.82);--bad-soft:#43201e;--stripe:rgba(85,196,226,.06);color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.bg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:75vmax;height:75vmax;max-width:none;opacity:.10;pointer-events:none;z-index:0}
main{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:32px 16px 56px}
.back{display:inline-flex;gap:6px;margin:0 0 18px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--accent);font-size:.9rem;font-weight:600;text-decoration:none}
.back:hover{border-color:var(--accent)}
h1{font-size:clamp(1.8rem,5vw,2.6rem);line-height:1.1;margin:0 0 6px;color:var(--duck)}
h2{font-size:1.25rem;margin:32px 0 10px;color:var(--accent)}
.sub{color:var(--muted);margin:0 0 20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:0 0 8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:1.3rem;color:var(--accent)}
.stat span{color:var(--muted);font-size:.82rem}
ul{padding-left:20px}li{margin:4px 0}
.scroll{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--accent);color:#fff;font-weight:600;white-space:nowrap}
tbody tr:nth-child(even){background:var(--stripe)}
tr.loss{background:var(--bad-soft)!important}
a{color:var(--accent)}
.note{color:var(--muted);font-size:.85rem;margin:8px 0}
footer{margin-top:36px;color:var(--muted);font-size:.85rem}
a.rep{display:block;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px;color:inherit;text-decoration:none}a.rep:hover{border-color:var(--accent)}a.rep b{display:block;font-size:1.15rem;color:var(--accent)}a.rep span{color:var(--muted);font-size:.95rem}
</style>
</head>
<body>
<img class="bg" src="../gas/logo.webp" alt="" aria-hidden="true">
<main>
<a class="back" href="../">&larr; Guides</a>
<h1>Blunt Rotation Reports</h1>
<p class="sub">Daily and weekly zKillboard hunt reports.</p>
<a class="rep" href="2026-11-27/"><b>27 Nov 2026</b><span>16 kills, 3 losses. 837.30M killed, 90.68M lost (90.2% ISK efficiency).</span></a>
</main>
</body>
</html>
